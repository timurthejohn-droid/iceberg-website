<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<title>Страница не найдена — Айсберг</title>
<style>
  :root{--blue:#123E63;--blue2:#2B6FA4;--ink:#0A0C0E;--mut:#6b7681;--line:#E3E7EA}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#fff;color:var(--ink);
       font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
  .box{max-width:640px;padding:8vh 6vw;text-align:left}
  .code{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
  h1{font-size:clamp(28px,5vw,44px);font-weight:300;letter-spacing:-.03em;line-height:1.05;
      margin:14px 0 10px;color:var(--blue)}
  p{color:var(--mut);margin:0 0 26px}
  ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:10px}
  li a{display:inline-block;padding:10px 16px;border:1px solid var(--line);border-radius:999px;
        color:var(--blue2);text-decoration:none;font-size:15px}
  li a:hover{border-color:var(--blue2);background:#EAF3F9}
  .tel{margin-top:28px;font-size:15px}
  .tel a{color:var(--blue);text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <main class="box">
    <div class="code">Ошибка 404</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, адрес изменился или страницу убрали. Ниже — основные разделы сайта.</p>
    <ul>
      <li><a href="/">Главная</a></li>
      <li><a href="/shveinoe-proizvodstvo/">Швейное производство</a></li>
      <li><a href="/tkani-optom/">Ткани оптом</a></li>
      <li><a href="/contacts/">Контакты</a></li>
    </ul>
    <div class="tel">Или позвоните: <a href="tel:+78123256993">+7 (812) 325-69-93</a></div>
  </main>
</body>
</html>
