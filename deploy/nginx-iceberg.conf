# ============================================================================
#  iceberg.spb.ru — боевой конфиг nginx после переезда на новый статический сайт
#  Задача: сменить движок (WordPress → статика), НЕ меняя URL и поисковые сигналы.
#  Все живые страницы отдаются статикой из корня; каталог трикотажа (177 старых
#  URL) 301-редиректится на biflex.tkany.com одним хопом; WordPress выключается.
#
#  Собран в задаче миграции (авг 2026). Карта редиректов: 01-iceberg/redirect-map-trikotazh.csv
#  Перед заливкой: см. 01-iceberg/deploy/RUNBOOK.md (бэкап WP → staging → сверка → переключение).
# ============================================================================

# --- (опц.) канонизация www → без www: canonical у сайта non-www --------------
server {
    listen 80;
    listen 443 ssl http2;
    server_name www.iceberg.spb.ru;
    # ssl_certificate ... ;            # сертификат хостинга (sprinthost)
    # ssl_certificate_key ... ;
    return 301 https://iceberg.spb.ru$request_uri;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name iceberg.spb.ru;

    # ssl_certificate ... ;            # сертификат хостинга (sprinthost)
    # ssl_certificate_key ... ;

    root /var/www/iceberg;             # ← сюда кладём содержимое 01-iceberg/site/
    index index.html;
    charset utf-8;

    # -- принудительный HTTPS (если хостинг терминирует SSL сам — убрать) --------
    # if ($scheme = http) { return 301 https://$host$request_uri; }

    # ------------------------------------------------------------------------
    # 1. КАТАЛОГ ТРИКОТАЖА → biflex.tkany.com (301, одним хопом)
    #    Раньше цепочка была в два прыжка:
    #      /trikotazhnie-tkani/NNN/ →301→ /trikotazhnie-polotna/NNN/ →301→ biflex
    #    Схлопываем в один хоп. Ловим ВСЕ варианты (polotna, polotna1, tkani,
    #    -pricelist, -pricelist1, numbered — проверено по Метрике 08.2026).
    #    Прайс -pricelist1 (был 200, 0 трафика) — по решению клиента тоже 301.
    # ------------------------------------------------------------------------
    location ~ ^/trikotazhnie- {
        return 301 https://biflex.tkany.com/;
    }

    # 1a. Рубрика каталога: на живом /category/trikotazhnie-polotna/ шла в два
    #     прыжка через /trikotazhnie-polotna/. Схлопываем в один.
    location ~ ^/category/trikotazhnie- { return 301 https://biflex.tkany.com/; }
    location ~ ^/category(/|$)          { return 301 https://iceberg.spb.ru/; }

    # 1b. Пустая /zhenskaya-odezhda-kupalniki/ → на страницу купальников (301).
    location ~ ^/zhenskaya-odezhda-kupalniki/?$ {
        return 301 https://iceberg.spb.ru/izgotovlenie-kupalnikov-i-sportivnoi-odezhdi/;
    }

    # 1c. RSS-ленты WordPress (были 200, ссылались все страницы) → разделы.
    location = /feed/          { return 301 https://iceberg.spb.ru/; }
    location = /comments/feed/ { return 301 https://iceberg.spb.ru/; }
    location ~ ^/(.+?)/feed/?$ { return 301 https://iceberg.spb.ru/$1/; }

    # 1d. Прайс-PDF, который на живом генерил PHP-скрипт → готовый файл.
    location = /documents/pricelist_print.php {
        return 301 https://iceberg.spb.ru/documents/pricelist.pdf;
    }

    # ------------------------------------------------------------------------
    # 2. МУСОР В ИНДЕКСЕ — служебная страница плагина Slide Anything.
    #    Отдаём 410 Gone, чтобы поисковик выкинул её из индекса.
    # ------------------------------------------------------------------------
    location = /slide-anything-popup-preview/ { return 410; }

    # ------------------------------------------------------------------------
    # 3. Старый WordPress-хвост: закрываем то, чего в статике уже нет.
    #    (wp-admin/wp-login/xmlrpc — чтобы не светить попытки входа в мёртвый WP)
    # ------------------------------------------------------------------------
    location ^~ /wp-admin/     { return 410; }
    location = /wp-login.php   { return 410; }
    location = /xmlrpc.php     { return 410; }
    location = /wp-comments-post.php { return 410; }
    location = /wp-cron.php    { return 410; }
    location = /wp-signup.php  { return 410; }
    location = /wp-trackback.php { return 410; }
    location ^~ /wp-json/      { return 410; }
    location ^~ /wp-includes/  { return 410; }
    location ^~ /wp-content/plugins/ { return 410; }
    location ^~ /wp-content/themes/  { return 410; }
    # Точка входа WordPress: на живом /index.php отдавал 301 на /.
    location = /index.php      { return 301 https://iceberg.spb.ru/; }

    # ------------------------------------------------------------------------
    # 4. Sitemap: старый Yoast-индекс (page-/post-sitemap.xml) заменяем на один
    #    чистый sitemap.xml (только живые 200-страницы, без 301-заглушек).
    #    Старые адреса Yoast 301-им на новый, чтобы вебмастер не ругался.
    # ------------------------------------------------------------------------
    location = /page-sitemap.xml { return 301 https://iceberg.spb.ru/sitemap.xml; }
    location = /post-sitemap.xml { return 301 https://iceberg.spb.ru/sitemap.xml; }

    # ------------------------------------------------------------------------
    # 5. Статические ассеты снимков (/_wp/) и общие — с длинным кэшем.
    # ------------------------------------------------------------------------
    location /_wp/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?|ttf|eot|otf|pdf|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------------
    # 6. ВСЁ ОСТАЛЬНОЕ — статические страницы нового сайта.
    #    /tkani-optom/ → /tkani-optom/index.html и т.д.
    #    (главная, ткани-оптом, контакты, вакансия, производство + подстраницы,
    #     снимки: /emdi/, /technicheskie-tkani/, прайс).
    # ------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # 7. 404 — своя страница (404.html кладётся в корень релизом).
    error_page 404 /404.html;
    location = /404.html { internal; }
}
